{% extends 'extractor/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-sm-9 col-md-7 col-lg-5">
        <div class="card border-info shadow-lg">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-2">Sign in</h1>
                <p class="text-secondary mb-4">Access the DICOM extractors and job history.</p>
                {% if form.errors %}
                <div class="alert alert-danger" role="alert">Username or password is incorrect.</div>
                {% endif %}
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" autofocus required value="{{ form.username.value|default_if_none:'' }}">
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" data-password-toggle required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-info w-100">Sign in</button>
                </form>
                <a class="d-block text-center mt-3 small" href="{% url 'forgot_password' %}">Forgot password?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
